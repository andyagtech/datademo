AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "CMS Claims Comparison Pipeline \u2014 Serverless deployment. 6-step\
  \ pipeline orchestrated by Step Functions, with Lambda container images for compute\
  \ and S3 for storage.\n"
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
  BucketNameSuffix:
    Type: String
    Default: cms-claims-pipeline
    Description: S3 bucket name suffix (prefixed with account ID)
  ExistingDataBucket:
    Type: String
    Default: andy-barr-cmsdata-assessment
    Description: Existing S3 bucket with pipeline data and DuckDB snapshots
Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    EphemeralStorage:
      Size: 10240
    Environment:
      Variables:
        BUCKET_NAME:
          Ref: DataBucket
        ENVIRONMENT:
          Ref: Environment
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::AccountId}-${BucketNameSuffix}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: CleanupTempFiles
          Prefix: runs/
          Status: Enabled
          ExpirationInDays: 30
        - Id: CleanupOldVersions
          Status: Enabled
          NoncurrentVersionExpiration:
            NoncurrentDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ReceiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-receive-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_receive
      MemorySize: 1024
      Timeout: 300
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: ReceiveFunction
  SchemaValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-schema-validate-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_schema_validate
      MemorySize: 1024
      Timeout: 300
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: SchemaValidateFunction
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-ingest-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_ingest
      MemorySize: 10240
      Timeout: 900
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: IngestFunction
  MatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-match-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_match
      MemorySize: 10240
      Timeout: 900
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: MatchFunction
  CompareFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-compare-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_compare
      MemorySize: 10240
      Timeout: 900
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: CompareFunction
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-report-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_report
      MemorySize: 4096
      Timeout: 600
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: ReportFunction
  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: cms-pipeline-${Environment}
      DefinitionUri: ../../statemachine.asl.json
      DefinitionSubstitutions:
        ReceiveFunctionArn:
          Fn::GetAtt:
          - ReceiveFunction
          - Arn
        SchemaValidateFunctionArn:
          Fn::GetAtt:
          - SchemaValidateFunction
          - Arn
        IngestFunctionArn:
          Fn::GetAtt:
          - IngestFunction
          - Arn
        MatchFunctionArn:
          Fn::GetAtt:
          - MatchFunction
          - Arn
        CompareFunctionArn:
          Fn::GetAtt:
          - CompareFunction
          - Arn
        ReportFunctionArn:
          Fn::GetAtt:
          - ReportFunction
          - Arn
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReceiveFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: SchemaValidateFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: IngestFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: MatchFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: CompareFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReportFunction
  DocsSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::AccountId}-${BucketNameSuffix}-docs-${Environment}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3600
  DocsSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DocsSiteBucket
      PolicyDocument:
        Statement:
        - Sid: PublicReadGetObject
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${DocsSiteBucket}/*
  PipelineApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: cms-pipeline-api-${Environment}
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: NONE
  StartPipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-start-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_start_pipeline
      MemorySize: 256
      Timeout: 30
      Policies:
      - StepFunctionsExecutionPolicy:
          StateMachineName:
            Fn::GetAtt:
            - PipelineStateMachine
            - Name
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      Environment:
        Variables:
          STATE_MACHINE_ARN:
            Ref: PipelineStateMachine
      Events:
        StartPipeline:
          Type: Api
          Properties:
            RestApiId:
              Ref: PipelineApi
            Path: /pipeline/start
            Method: POST
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: StartPipelineFunction
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cms-pipeline-chat-${Environment}
      PackageType: Image
      ImageConfig:
        Command:
        - cloud.handlers.handle_chat
      MemorySize: 4096
      Timeout: 120
      EphemeralStorage:
        Size: 10240
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: ExistingDataBucket
      - SSMParameterReadPolicy:
          ParameterName: cms-pipeline/openai-api-key
      Environment:
        Variables:
          BUCKET_NAME:
            Ref: ExistingDataBucket
          OPENAI_API_KEY_SSM: /cms-pipeline/openai-api-key
          DB_S3_KEY: runs/latest/cms_claims.duckdb
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: PipelineApi
            Path: /api/chat
            Method: POST
        ChatOptions:
          Type: Api
          Properties:
            RestApiId:
              Ref: PipelineApi
            Path: /api/chat
            Method: OPTIONS
      ImageUri: receivefunction:latest
    Metadata:
      DockerContext: /Users/andy/assesment_1
      DockerTag: latest
      Dockerfile: cloud/Dockerfile
      SamResourceId: ChatFunction
Outputs:
  DataBucketName:
    Description: S3 bucket for pipeline data
    Value:
      Ref: DataBucket
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value:
      Ref: PipelineStateMachine
  ApiEndpoint:
    Description: API Gateway endpoint to start the pipeline
    Value:
      Fn::Sub: https://${PipelineApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/pipeline/start
  DocsSiteUrl:
    Description: URL for the static documentation site
    Value:
      Fn::GetAtt:
      - DocsSiteBucket
      - WebsiteURL
  DocsSiteBucketName:
    Description: S3 bucket for the static documentation site
    Value:
      Ref: DocsSiteBucket
  ChatApiEndpoint:
    Description: API Gateway endpoint for the AI chat assistant
    Value:
      Fn::Sub: https://${PipelineApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/api/chat
